services:
  - type: web
    name: alves-play-api
    runtime: node
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alves-play-db
          property: connectionString
      - key: PGSSLMODE
        value: require
      - key: TRIAL_DURATION_HOURS
        value: "4"
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: alves-play-db
    databaseName: alvesplay
    user: alvesplay
    plan: free
    region: ohio
