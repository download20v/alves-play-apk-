services:
  - type: web
    name: alves-play-api
    runtime: node
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Configure with the Supabase PostgreSQL Session Pooler URI in Render Dashboard.
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: TRIAL_DURATION_HOURS
        value: "4"
      - key: ALLOWED_ORIGINS
        value: "*"
