<!-- ================= SISTEMA DE BOT DE TESTE E RENOVACAO (ALVES PLAY) ================= -->
<style>
.alves-bot-fab{position:fixed;right:16px;bottom:18px;z-index:90;background:linear-gradient(135deg,#7c5cff,#25d0a4);color:#fff;border:0;border-radius:999px;padding:12px 18px;font:700 14px/1 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;box-shadow:0 8px 24px #7c5cff66;display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:transform .16s ease,background .2s ease,padding .2s ease,font-size .2s ease,box-shadow .2s ease}
.alves-bot-fab.renew-mode{background:linear-gradient(135deg,#15803d,#22c55e);padding:15px 24px;font-size:15.5px;font-weight:800;box-shadow:0 10px 28px rgba(34,197,94,.48);border:1px solid #86efac}
.alves-bot-fab:active{transform:scale(.96)}
.alves-bot-dot{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}
.alves-bot-backdrop{position:fixed;inset:0;z-index:950;background:rgba(5,7,14,.84);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;padding:0}
.alves-bot-backdrop.open{display:flex}
@media(min-width:640px){.alves-bot-backdrop{align-items:center;padding:16px}}
.alves-bot-card{width:100%;max-width:540px;max-height:92vh;background:#121622;border:1px solid #2b3349;border-radius:20px 20px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px;color:#f7f8fb;box-shadow:0 -10px 40px #000a}
@media(min-width:640px){.alves-bot-card{border-radius:18px}}
.alves-bot-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.alves-bot-title{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.alves-bot-close{width:34px;height:34px;border-radius:10px;background:#191f2d;border:1px solid #2c344a;color:#f7f8fb;font-size:15px;cursor:pointer}
.alves-bot-chat{height:42vh;overflow-y:auto;background:#090b12;border:1px solid #252c3d;border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:9px}
.alves-bot-msg{max-width:90%;padding:10px 12px;border-radius:12px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.alves-bot-msg.bot{align-self:flex-start;background:#191f2d;border:1px solid #252c3d;color:#f1f5f9}
.alves-bot-msg.user{align-self:flex-end;background:#7c5cff;color:#fff}
.alves-bot-cmds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.alves-bot-cmd{padding:11px 10px;border-radius:11px;font-size:13px;font-weight:800;color:#fff;border:1px solid transparent;cursor:pointer;text-align:center;transition:transform .12s,filter .15s}
.alves-bot-cmd:active{transform:scale(.97)}
.alves-bot-cmd.green{background:linear-gradient(135deg,#16a34a,#10b981);border-color:#34d399;box-shadow:0 4px 14px rgba(16,185,129,.35)}
.alves-bot-cmd.blue{background:linear-gradient(135deg,#2563eb,#3b82f6);border-color:#60a5fa;box-shadow:0 4px 14px rgba(37,99,235,.35)}
.alves-bot-cmd:disabled,.alves-bot-send:disabled{opacity:.55;cursor:not-allowed}
.alves-bot-row{display:flex;gap:8px}
.alves-bot-input{flex:1;padding:11px 12px;border-radius:11px;border:1px solid #30374b;background:#090b12;color:#fff;outline:none;font-size:14px}
.alves-bot-input:focus{border-color:#7c5cff}
.alves-bot-send{padding:0 16px;border-radius:11px;background:#7c5cff;color:#fff;font-weight:700;cursor:pointer}
.alves-bot-loadbtn{margin-top:8px;width:100%;padding:9px 10px;border-radius:9px;background:#25d0a4;color:#06231c;font-weight:800;font-size:13px;cursor:pointer}
.alves-bot-renew-box{background:#0b1713;border:1px solid rgba(34,197,94,.45);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.alves-bot-renew-label{font-size:13.5px;font-weight:800;color:#86efac;letter-spacing:.2px}
.alves-bot-renew-url{font-size:12px;color:#bbf7d0;background:#06100d;border:1px solid rgba(34,197,94,.25);border-radius:9px;padding:8px 10px;word-break:break-all}
.alves-bot-renew-actions{display:flex;gap:8px;flex-wrap:wrap}
.alves-bot-openbtn{flex:1;min-width:150px;padding:11px 14px;border-radius:10px;background:linear-gradient(135deg,#15803d,#22c55e);color:#fff;font-weight:800;font-size:13.5px;cursor:pointer}
</style>

<button type="button" id="alvesBotFab" class="alves-bot-fab" aria-label="Abrir bot de teste">
  <span class="alves-bot-dot"></span>
  <span id="alvesBotFabLabel">Teste 🤖</span>
</button>

<div id="alvesBotModal" class="alves-bot-backdrop" role="dialog" aria-modal="true" aria-label="Bot de Teste e Renovação IPTV">
  <div class="alves-bot-card">
    <div class="alves-bot-head">
      <div class="alves-bot-title" id="alvesBotModalTitle">🤖 Bot de Teste</div>
      <button type="button" id="alvesBotClose" class="alves-bot-close" aria-label="Fechar">✕</button>
    </div>

    <div id="alvesBotRenewPanel" class="alves-bot-renew-box" style="display:none;">
      <div class="alves-bot-renew-label">Assinar/Renovar Plano:</div>
      <div class="alves-bot-renew-url" id="alvesBotRenewUrlText"></div>
      <div class="alves-bot-renew-actions">
        <button type="button" id="alvesBotOpenRenewBtn" class="alves-bot-openbtn">🔄 Abrir Sistema de Renovação</button>
      </div>
    </div>

    <div id="alvesBotChat" class="alves-bot-chat"></div>

    <div id="alvesBotCmds" class="alves-bot-cmds">
      <button type="button" id="alvesBotBtnSemAdulto" class="alves-bot-cmd green">🛡️ #TESTE SEM ADULTO</button>
      <button type="button" id="alvesBotBtnCompleto" class="alves-bot-cmd blue">⭐ #TESTE COMPLETO</button>
    </div>

    <div id="alvesBotRow" class="alves-bot-row">
      <input type="text" id="alvesBotInput" class="alves-bot-input" placeholder="Digite #TESTE SEM ADULTO ou #TESTE COMPLETO..." />
      <button type="button" id="alvesBotSend" class="alves-bot-send">Enviar</button>
    </div>
  </div>
</div>
