<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d16"><title>Painel de Suporte • ALVES PLAY</title>
<style>
:root{color-scheme:dark;--bg:#090d16;--panel:#111a29;--line:#26364c;--green:#20c878;--muted:#91a3b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fb;font:14px system-ui,Arial}.wrap{max-width:1120px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}.login{max-width:480px;margin:12vh auto}.row{display:flex;gap:8px}input,textarea{background:#0a1220;border:1px solid var(--line);border-radius:10px;color:white;padding:11px;font:inherit;min-width:0;width:100%}button{border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:#061a10;font-weight:800;cursor:pointer}button.secondary{background:#26364c;color:white}button:disabled{opacity:.5}.list{display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow:auto}.item{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#0c1523}.item.active{border-color:var(--green)}.item p{margin:6px 0 0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{color:var(--green);font-size:11px}.messages{height:55vh;overflow:auto;display:flex;flex-direction:column;gap:9px;margin:12px 0}.bubble{max-width:85%;padding:10px 12px;border-radius:13px;white-space:pre-wrap;overflow-wrap:anywhere}.client{align-self:flex-start;background:#26364c}.admin{align-self:flex-end;background:#126b49}.time{display:block;color:#c5d2df;font-size:10px;margin-top:5px}.compose{display:flex;gap:8px}.compose textarea{min-height:48px;max-height:120px;resize:vertical}.error{color:#ff9b9b}.hide{display:none!important}@media(max-width:720px){.grid{grid-template-columns:1fr}.list{max-height:30vh}.messages{height:42vh}}
</style></head><body><main class="wrap">
<section id="login" class="panel login"><h2>ALVES PLAY • Administração</h2><p class="muted">Entre com o token administrativo configurado no servidor.</p><input id="token" type="password" autocomplete="current-password" placeholder="Token administrativo"><div class="row" style="margin-top:10px"><button id="enter">Entrar</button></div><p id="loginError" class="error"></p></section>
<section id="app" class="hide"><header class="head"><div><b style="font-size:20px">Central de Atendimento</b><div class="muted">Conversas de clientes por identificador de dispositivo</div></div><div class="row"><button class="secondary" id="reload">Atualizar</button><button class="secondary" id="logout">Sair</button></div></header>
<div class="grid"><aside class="panel"><div class="row"><input id="filter" placeholder="Buscar código do dispositivo…"></div><div id="list" class="list" style="margin-top:12px"></div></aside>
<section class="panel"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><div><b id="title">Selecione uma conversa</b><div class="muted" id="device"></div></div><button id="toggle" class="secondary" disabled>Encerrar</button></div><div id="messages" class="messages"></div><div class="compose"><textarea id="reply" maxlength="4000" placeholder="Responder ao cliente…" disabled></textarea><button id="send" disabled>Enviar</button></div><p id="notice" class="muted"></p></section></div></section>
</main><script src="app-config.js"></script><script>
(()=>{'use strict';const base=String(window.ALVES_PLAY_API_BASE||'').replace(/\/$/,'');const $=id=>document.getElementById(id);let token=sessionStorage.getItem('alves_support_admin_token')||'';let conversations=[];let selected=null;let busy=false;
function auth(){return {'content-type':'application/json','authorization':'Bearer '+token}}
async function api(path,opts={}){const r=await fetch(base+path,{...opts,headers:{...auth(),...(opts.headers||{})},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||'Erro '+r.status);return d}
function showApp(){ $('login').classList.add('hide');$('app').classList.remove('hide');loadList()}
function time(v){try{return new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}catch{return ''}}
async function enter(){if(!base){$('loginError').textContent='Configure ALVES_PLAY_API_BASE em app-config.js.';return}token=$('token').value.trim();try{await api('/admin/support/conversations');sessionStorage.setItem('alves_support_admin_token',token);$('loginError').textContent='';showApp()}catch(e){$('loginError').textContent=e.message}}
async function loadList(){try{const d=await api('/admin/support/conversations');conversations=d.conversations||[];drawList();if(selected){const still=conversations.find(x=>String(x.id)===String(selected));if(still)await openConversation(still.id);else selected=null}}catch(e){$('notice').textContent=e.message}}
function drawList(){const q=$('filter').value.trim().toLowerCase();const box=$('list');box.replaceChildren();const arr=conversations.filter(c=>c.client_id.toLowerCase().includes(q));if(!arr.length){box.textContent='Nenhuma conversa encontrada.';return}arr.forEach(c=>{const el=document.createElement('div');el.className='item'+(String(c.id)===String(selected)?' active':'');const b=document.createElement('b');b.textContent='Dispositivo '+c.client_id.slice(0,12)+'…';const p=document.createElement('p');p.textContent=c.last_message||'Sem mensagens';const meta=document.createElement('div');meta.className='tag';meta.textContent=(c.status==='closed'?'Encerrado':'Aberto')+' • '+(c.unread_client||0)+' não lida(s)';el.append(b,p,meta);el.addEventListener('click',()=>openConversation(c.id));box.append(el)})}
async function openConversation(id){selected=String(id);drawList();try{const d=await api('/admin/support/conversations/'+id+'/messages');$('title').textContent='Atendimento #'+id;$('device').textContent='Dispositivo: '+d.conversation.client_id;$('toggle').disabled=false;$('toggle').textContent=d.conversation.status==='closed'?'Reabrir atendimento':'Encerrar';$('reply').disabled=false;$('send').disabled=false;const box=$('messages');box.replaceChildren();(d.messages||[]).forEach(m=>{const b=document.createElement('div');b.className='bubble '+(m.sender==='admin'?'admin':'client');b.append(document.createTextNode(m.message));const t=document.createElement('span');t.className='time';t.textContent=(m.sender==='admin'?'Administrador':'Cliente')+' • '+time(m.created_at);b.append(t);box.append(b)});box.scrollTop=box.scrollHeight;$('notice').textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR')}catch(e){$('notice').textContent=e.message}}
async function send(){if(!selected||busy)return;const message=$('reply').value.trim();if(!message)return;busy=true;$('send').disabled=true;try{await api('/admin/support/conversations/'+selected+'/messages',{method:'POST',body:JSON.stringify({message})});$('reply').value='';await openConversation(selected);await loadList()}catch(e){$('notice').textContent=e.message}finally{busy=false;$('send').disabled=false}}
async function toggle(){if(!selected)return;const c=conversations.find(x=>String(x.id)===String(selected));if(!c)return;try{await api('/admin/support/conversations/'+selected,{method:'PATCH',body:JSON.stringify({status:c.status==='closed'?'open':'closed'})});await loadList();await openConversation(selected)}catch(e){$('notice').textContent=e.message}}
$('enter').addEventListener('click',enter);$('token').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});$('reload').addEventListener('click',loadList);$('logout').addEventListener('click',()=>{sessionStorage.removeItem('alves_support_admin_token');token='';location.reload()});$('filter').addEventListener('input',drawList);$('send').addEventListener('click',send);$('toggle').addEventListener('click',toggle);$('reply').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});if(token){$('token').value=token;showApp()}setInterval(()=>{if(token)loadList()},7000);
})();
</script></body></html>
